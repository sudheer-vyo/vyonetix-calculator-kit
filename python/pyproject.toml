[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vyonetix-calc-kit"
version = "0.1.0"
description = "Small dependency-free engineering planning calculations and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vyonetix Solutions"}]
keywords = ["calculator", "energy", "printer-yield", "engineering", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities"
]

[project.urls]
Homepage = "https://deals.vyonetixsolutions.com.au/tools/"
Repository = "https://github.com/sudheer-vyo/vyonetix-calculator-kit"
Issues = "https://github.com/sudheer-vyo/vyonetix-calculator-kit/issues"

[project.scripts]
vyonetix-calc = "vyonetix_calc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
